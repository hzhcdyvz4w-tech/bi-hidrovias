name: Atualizar bases Google Drive do BI

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-siop.yml'

permissions:
  contents: write

jobs:
  atualizar-bases:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair bases autorizadas
        shell: bash
        run: |
          set -euo pipefail
          MAIN='https://script.google.com/macros/s/AKfycbyUCnZm3VwmEivBW04wXSP8bPONg4Cv00acK7MaxZ_54jRMzgdwyIPUDmYnm3pasMLnvw/exec'
          SIOP='https://script.google.com/macros/s/AKfycbyBOezMVBXAnk1ZMI0fzYoWzHR_Fn37pdoQR3UUkYqM8cCDbUPzUBzCO-23iwmBVJYvnw/exec'
          curl -A "Mozilla/5.0" -H "Accept: application/json,text/plain,*/*" -L --fail --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 180 "$MAIN" -o /tmp/main.raw
          curl -A "Mozilla/5.0" -H "Accept: application/json,text/plain,*/*" -L --fail --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 180 "$SIOP" -o /tmp/siop.raw

      - name: Validar e gerar snapshots
        shell: python
        run: |
          import json, pathlib

          def parse_json(path, label):
              text = pathlib.Path(path).read_text(encoding='utf-8', errors='replace')
              clean = text.lstrip('\ufeff \t\r\n')
              try:
                  return json.loads(clean)
              except Exception as first:
                  for marker in ('{"ok":true', '{"schemaVersion":', '{"project":', '{"projeto":'):
                      i = clean.find(marker)
                      if i >= 0:
                          try:
                              obj, end = json.JSONDecoder().raw_decode(clean[i:])
                              print(f'{label}: JSON recuperado após prefixo de {i} caracteres.')
                              return obj
                          except Exception:
                              pass
                  print(f'{label}: resposta não JSON. Tamanho={len(text)}. Início={text[:240]!r}')
                  print(f'{label}: posição de ok=true: {clean.find(chr(123)+chr(34)+"ok"+chr(34)+":true")}')
                  raise first

          main = parse_json('/tmp/main.raw', 'MAIN')
          rows = main.get('investments') or main.get('data')
          if not isinstance(rows, list) or len(rows) != 19:
              raise SystemExit(f'Base principal inválida: esperado 19 investimentos, recebido {0 if not isinstance(rows,list) else len(rows)}')
          ids = [str(x.get('id')) for x in rows]
          if len(ids) != len(set(ids)) or any(not x.get('nome') for x in rows):
              raise SystemExit('Base principal inválida: IDs duplicados ou investimento sem nome')
          pathlib.Path('bi_hidrovias_public.json').write_text(
              json.dumps(main, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8'
          )
          print(f'MAIN OK: {len(rows)} investimentos.')

          try:
              siop = parse_json('/tmp/siop.raw', 'SIOP')
              if siop.get('ok') is not True:
                  raise ValueError('ok != true')
              inv = siop.get('investimentos')
              if not isinstance(inv, list) or not inv:
                  raise ValueError('investimentos ausentes')
              m = siop.get('metadata') or {}
              qtd = int(m.get('quantidadeInvestimentosComSiop', len(inv)))
              if qtd != len(inv):
                  raise ValueError(f'metadata={qtd}, lista={len(inv)}')
              for item in inv:
                  for ex in item.get('exercicios', []):
                      for r in ex.get('registros', []):
                          status = str(r.get('statusValidacao','')).upper()
                          if status and not status.startswith('SIM'):
                              raise ValueError('registro não habilitado: '+status)
              pathlib.Path('siop_hidrovias_public.json').write_text(
                  json.dumps(siop, ensure_ascii=False, separators=(',', ':')),
                  encoding='utf-8'
              )
              print(f'SIOP OK: {len(inv)} investimentos integrados.')
          except Exception as exc:
              # Segurança operacional: preserva o último snapshot homologado.
              if not pathlib.Path('siop_hidrovias_public.json').exists():
                  raise
              print('SIOP: fonte remota não pôde ser normalizada; mantendo snapshot homologado existente.')
              print('SIOP erro:', repr(exc))

      - name: Publicar somente se houver alteração
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- bi_hidrovias_public.json siop_hidrovias_public.json)" ]; then
            echo "Sem alteração nas bases."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bi_hidrovias_public.json siop_hidrovias_public.json
          git commit -m "Atualiza snapshots das bases Google Drive"
          git push
