name: Atualizar base SIOP do BI

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-siop.yml'

permissions:
  contents: write

jobs:
  atualizar-siop:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair SIOP do Google Drive via camada de junção
        shell: bash
        run: |
          set -euo pipefail
          URL='https://script.google.com/macros/s/AKfycbyBOezMVBXAnk1ZMI0fzYoWzHR_Fn37pdoQR3UUkYqM8cCDbUPzUBzCO-23iwmBVJYvnw/exec'
          curl -L --fail --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 180 "$URL?_source=github-actions" -o /tmp/siop.json

      - name: Validar estrutura e integridade
        shell: python
        run: |
          import json, pathlib, sys
          p = pathlib.Path('/tmp/siop.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          if data.get('ok') is not True:
              raise SystemExit('API SIOP retornou ok != true')
          investimentos = data.get('investimentos')
          if not isinstance(investimentos, list) or not investimentos:
              raise SystemExit('Lista de investimentos ausente/vazia')
          m = data.get('metadata') or {}
          qtd = m.get('quantidadeInvestimentosComSiop', len(investimentos))
          if int(qtd) != len(investimentos):
              raise SystemExit(f'Divergência de investimentos: metadata={qtd}, lista={len(investimentos)}')
          # Segurança: somente relações habilitadas devem aparecer na integração.
          for inv in investimentos:
              for ex in inv.get('exercicios', []):
                  for r in ex.get('registros', []):
                      status = str(r.get('statusValidacao','')).upper()
                      if status and not status.startswith('SIM'):
                          raise SystemExit('Registro não habilitado encontrado: '+status)
          pathlib.Path('siop_hidrovias_public.json').write_text(
              json.dumps(data, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8'
          )
          print(f'OK: {len(investimentos)} investimentos integrados')

      - name: Publicar somente se houver alteração
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- siop_hidrovias_public.json; then
            echo "Sem alteração material na base SIOP."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add siop_hidrovias_public.json
          git commit -m "Atualiza base SIOP automaticamente"
          git push
