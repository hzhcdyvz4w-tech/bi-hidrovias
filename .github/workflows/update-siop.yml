name: Atualizar bases Google Drive do BI

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-siop.yml'

permissions:
  contents: write

jobs:
  atualizar-bases:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair base principal e SIOP do Google Drive
        shell: bash
        run: |
          set -euo pipefail
          MAIN='https://script.google.com/macros/s/AKfycbyUCnZm3VwmEivBW04wXSP8bPONg4Cv00acK7MaxZ_54jRMzgdwyIPUDmYnm3pasMLnvw/exec'
          SIOP='https://script.google.com/macros/s/AKfycbyBOezMVBXAnk1ZMI0fzYoWzHR_Fn37pdoQR3UUkYqM8cCDbUPzUBzCO-23iwmBVJYvnw/exec'
          curl -A "Mozilla/5.0" -H "Accept: application/json,text/plain,*/*" -L --fail --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 180 "$MAIN" -o /tmp/main.json
          curl -A "Mozilla/5.0" -H "Accept: application/json,text/plain,*/*" -L --fail --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 180 "$SIOP" -o /tmp/siop.json\n          echo "SIOP content-type/signature:"\n          head -c 120 /tmp/siop.json | tr "\\n" " "

      - name: Validar e publicar snapshots
        shell: python
        run: |
          import json, pathlib

          main = json.loads(pathlib.Path('/tmp/main.json').read_text(encoding='utf-8'))
          rows = main.get('investments') or main.get('data')
          if not isinstance(rows, list) or len(rows) != 19:
              raise SystemExit(f'Base principal inválida: esperado 19 investimentos, recebido {0 if not isinstance(rows,list) else len(rows)}')
          ids = [str(x.get('id')) for x in rows]
          if len(ids) != len(set(ids)):
              raise SystemExit('Base principal inválida: IDs duplicados')
          if any(not x.get('nome') for x in rows):
              raise SystemExit('Base principal inválida: investimento sem nome')
          pathlib.Path('bi_hidrovias_public.json').write_text(
              json.dumps(main, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8'
          )

          siop = json.loads(pathlib.Path('/tmp/siop.json').read_text(encoding='utf-8'))
          if siop.get('ok') is not True:
              raise SystemExit('API SIOP retornou ok != true')
          inv = siop.get('investimentos')
          if not isinstance(inv, list) or not inv:
              raise SystemExit('Lista SIOP de investimentos ausente/vazia')
          m = siop.get('metadata') or {}
          qtd = int(m.get('quantidadeInvestimentosComSiop', len(inv)))
          if qtd != len(inv):
              raise SystemExit(f'Divergência SIOP: metadata={qtd}, lista={len(inv)}')
          for item in inv:
              for ex in item.get('exercicios', []):
                  for r in ex.get('registros', []):
                      status = str(r.get('statusValidacao','')).upper()
                      if status and not status.startswith('SIM'):
                          raise SystemExit('Registro SIOP não habilitado encontrado: '+status)
          pathlib.Path('siop_hidrovias_public.json').write_text(
              json.dumps(siop, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8'
          )

          print(f'OK: base principal com {len(rows)} investimentos; SIOP com {len(inv)} investimentos integrados')

      - name: Publicar somente se houver alteração
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bi_hidrovias_public.json siop_hidrovias_public.json; then
            echo "Sem alteração nas bases."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bi_hidrovias_public.json siop_hidrovias_public.json
          git commit -m "Atualiza bases Google Drive automaticamente"
          git push
